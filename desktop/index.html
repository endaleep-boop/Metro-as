<title>Metro A.Ş. – İstanbul</title>
<style>
:root{--bg:#f4ead5;--fg:#2b2a4c;--card:#fffaf0;--water:#a9d6d9;--land:#f0dfbd;--road:#d9c49a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15162b;--fg:#f3e9d2;--card:#1f2142;--water:#0f2b3d;--land:#27233f;--road:#3d3860}}
:root[data-theme="dark"]{--bg:#15162b;--fg:#f3e9d2;--card:#1f2142;--water:#0f2b3d;--land:#27233f;--road:#3d3860}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
#hud{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:8px 12px;background:var(--card);font-size:14px;border-bottom:2px solid var(--road);font-family:Georgia,'Times New Roman',serif}
#hud b{font-size:16px}
#hud button{border:0;border-radius:6px;padding:5px 9px;color:#fff;font-weight:600;cursor:pointer}
#spd{margin-left:auto;display:flex;gap:4px;align-items:center}
.sb{background:#6b5f5f;min-width:34px}.sb.on{background:#d8432a}
#tip{display:none;align-items:center;gap:10px;padding:7px 12px;background:#f3e6c4;color:#241a10;border-bottom:2px solid #c9a24b;font:600 14px/1.35 Georgia,'Times New Roman',serif}
#tip span{flex:1}
#tip button{border:1px solid #241a10;background:transparent;color:#241a10;border-radius:50%;width:26px;height:26px;cursor:pointer;padding:0}
#wrap{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#msg{position:absolute;left:0;right:0;top:8px;text-align:center;font-size:14px;pointer-events:none;padding:0 12px}
#msg span{background:#f3e6c4;color:#241a10;border:1px solid #3a2a18;border-radius:2px;box-shadow:2px 3px 0 rgba(0,0,0,.35);font-family:Georgia,'Times New Roman',serif;padding:6px 12px;display:inline-block;line-height:1.4}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);text-align:center;padding:20px;z-index:8}
#ov>div{background:var(--card);border-radius:12px;padding:22px;max-width:380px;max-height:92%;overflow:auto;line-height:1.5;font-size:14px}
#ov button{margin-top:10px;border:0;border-radius:8px;padding:10px 18px;background:#e2431f;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
#ov ol{text-align:left;margin:8px 0 8px 18px;padding:0}
#menu{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--bg);padding:20px;overflow:auto;text-align:center;z-index:7;background-image:radial-gradient(circle at 1px 1px,var(--road) 1.2px,transparent 1.6px);background-size:22px 22px}
#menu h1,#menu h2,#menu p{margin:0}
#menu h1{font:700 38px Georgia,'Times New Roman',serif;letter-spacing:1px}
#menu h2{font:700 26px Georgia,'Times New Roman',serif}
#menu p{letter-spacing:4px;font-size:12px;opacity:.7}
.mb{border-radius:4px;border:2px solid var(--fg);box-shadow:3px 3px 0 var(--fg);padding:12px 18px;background:var(--card);color:var(--fg);font-size:16px;font-weight:600;min-width:220px;cursor:pointer}
.mb.on{background:#e2431f;color:#fff}.mb.sm{min-width:0;padding:8px 12px;font-size:14px;margin:2px}
.mb.big{background:#c9a24b;color:#241a10;font-size:17px;padding:14px 18px;width:100%;box-sizing:border-box}
.card{background:var(--card);border:1px solid var(--road);border-radius:6px;padding:12px 16px;max-width:340px;width:100%;line-height:1.5;box-sizing:border-box;font-size:14px}
#mg{position:absolute;inset:0;display:none;flex-direction:column;gap:8px;padding:10px 10px 84px;overflow:auto;z-index:2;background:#2a1d14 repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 2px,transparent 2px 6px)}
#mg .tabs{display:flex;gap:4px;flex-wrap:wrap;position:sticky;top:-10px;background:#2a1d14;border-bottom:1px solid #c9a24b;padding:6px 0;z-index:3}
#mg .card{max-width:none;text-align:left;line-height:1.9}
#mg .mb{background:#f3e6c4;color:#241a10;border:2px solid #c9a24b;box-shadow:2px 2px 0 #000}
#mg .mb.on{background:#c9a24b}
#mg .mb.big{background:#c9a24b;border-color:#f3e6c4}
#mg select{border-radius:5px;border:2px solid var(--fg);background:var(--card);color:var(--fg);font-size:13px;max-width:100%}
#ds{position:absolute;inset:0;display:none;flex-direction:column;z-index:3;color:#fff;background-color:#1f5fc4;background-image:linear-gradient(rgba(255,255,255,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.13) 1px,transparent 1px);background-size:24px 24px;font-family:'Arial Narrow',Arial,sans-serif}
#ds .dh{display:flex;justify-content:flex-end;padding:10px 14px;font-size:14px}
#ds input{background:transparent;border:0;border-bottom:1px solid #fff;color:#fff;font-size:14px;width:120px}
#ds .dm{flex:1;display:flex;flex-wrap:wrap;gap:12px;padding:8px 16px;overflow:auto;align-content:flex-start}
#ds .dleft{min-width:200px}#ds .dc{flex:1;min-width:260px;text-align:center}
#ds .dl{margin:0 0 14px;text-transform:uppercase;font-size:13px;letter-spacing:.5px}
#ds .dr{display:flex;align-items:center;gap:12px;margin-top:6px;font-size:18px}
#ds .dr b{width:30px;height:30px;border:2px solid #fff;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
#ds .dst{margin-top:8px;font-size:13px;line-height:1.7}
#ds .bad{color:#ffb4a8}#ds .lk{text-decoration:underline;cursor:pointer;margin-right:8px;font-weight:700}
#ds .dbar{display:flex;background:#111}
#ds .db{flex:1;text-align:center;padding:12px 0;font-size:22px;cursor:pointer;color:#fff}#ds .db.on{background:#fff;color:#111}
#fab{position:absolute;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#fb{display:flex;align-items:center;gap:8px;border:2px solid #c9a24b;border-radius:12px;padding:10px 18px;font:700 15px Georgia,'Times New Roman',serif;letter-spacing:2px;text-transform:uppercase;color:#f3e6c4;background:linear-gradient(#4a3524,#2a1d14);box-shadow:0 4px 0 #120c07,0 8px 18px rgba(0,0,0,.45);cursor:pointer}
#fb:active{transform:translateY(2px);box-shadow:0 2px 0 #120c07}
#fm{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:252px;padding:14px;border:2px solid #c9a24b;border-radius:16px;background:linear-gradient(rgba(58,40,27,.95),rgba(33,23,16,.95));box-shadow:0 12px 36px rgba(0,0,0,.55),inset 0 0 0 4px rgba(201,162,75,.18);opacity:0;visibility:hidden;transform:translateY(12px) scale(.96);transform-origin:bottom right;pointer-events:none;transition:opacity .18s,transform .18s,visibility .18s}
#fm.open{opacity:1;visibility:visible;transform:none;pointer-events:auto}
#fm .ft{grid-column:1/-1;text-align:center;font:700 11px Georgia,serif;letter-spacing:4px;color:#c9a24b;border-bottom:1px solid rgba(201,162,75,.5);padding-bottom:8px;margin-bottom:2px}
#fm button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 6px;border:1px solid rgba(201,162,75,.45);border-radius:10px;background:rgba(255,235,190,.06);color:#f3e6c4;font:600 12px Georgia,serif;letter-spacing:1px;cursor:pointer;text-align:center;transition:background .15s,transform .15s}
#fm button:hover{background:rgba(201,162,75,.28);transform:translateY(-2px)}
#fm button i{font-style:normal;font-size:24px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:radial-gradient(circle at 30% 30%,#e6c777,#9a7424);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
#np{position:absolute;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:rgba(10,8,5,.62);padding:12px}
#np .paper{position:relative;width:min(560px,100%);max-height:92%;overflow:auto;box-sizing:border-box;background-color:#eee0bd;background-image:radial-gradient(ellipse at 20% 10%,rgba(255,255,255,.4),transparent 60%),repeating-linear-gradient(0deg,rgba(90,60,20,.06) 0 2px,transparent 2px 4px);color:#241a10;border:3px double #3a2a18;outline:2px solid #3a2a18;outline-offset:-10px;padding:24px 26px 18px;box-shadow:0 18px 50px rgba(0,0,0,.6);transform:rotate(-.5deg);font-family:'Old Standard TT',Georgia,'Times New Roman',serif}
#np .mast{text-align:center;font:400 38px/1.1 'UnifrakturCook','Old English Text MT',Georgia,serif;border-bottom:3px double #241a10;padding:0 30px 8px}
#np .meta{display:flex;justify-content:space-between;gap:8px;font-size:11px;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid #241a10;padding:4px 0;margin-bottom:12px}
#np h2{font:900 30px/1.05 'Playfair Display',Georgia,serif;text-transform:uppercase;margin:6px 0 12px;text-align:center}
#np .body{column-count:2;column-gap:22px;column-rule:1px solid #241a10;font-size:14px;line-height:1.5;text-align:justify;hyphens:auto}
#np .body::first-letter{float:left;font:900 42px/.85 'Playfair Display',Georgia,serif;padding:3px 6px 0 0}
#np .x{position:absolute;top:8px;right:10px;width:32px;height:32px;border:2px solid #241a10;background:#eee0bd;color:#241a10;font:700 16px Georgia,serif;border-radius:50%;cursor:pointer;padding:0}
#np .ok{display:block;margin:16px auto 0;padding:9px 30px;background:#241a10;color:#eee0bd;border:0;font:700 14px Georgia,serif;letter-spacing:3px;text-transform:uppercase;cursor:pointer}
@media (max-width:640px),(pointer:coarse){
 #hud{font-size:13px;gap:6px 12px}
 .sb{min-width:38px;padding:9px 8px}
 .mb.sm{padding:11px 14px;font-size:15px}
 #fb{padding:13px 22px;font-size:16px}
 #fm{width:280px}#fm button{padding:12px 6px;font-size:13px}
 #ds .db{padding:16px 0;font-size:24px}#ds .dr b{width:38px;height:38px}
 #np .body{column-count:1}#np .mast{font-size:30px}#np h2{font-size:24px}
}

/* ---- dokunmatik ---- */
*{-webkit-tap-highlight-color:transparent}html{overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}input{-webkit-user-select:text;user-select:text}
button,select,.lk,.db{touch-action:manipulation}button{min-height:40px}
#mg,#menu,#ov>div,#np .paper,#ds .dm{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#tip button{width:38px;height:38px}#np .x{width:42px;height:42px}#ds .dr b{width:42px;height:42px}.sb{min-height:40px;min-width:40px}
#fm button{min-height:64px}#ds .lk{display:inline-block;padding:8px 4px}

#mg button{cursor:pointer}#mg [data-g^=bm],#mg [data-g^=bp]{min-width:52px;min-height:52px;font-size:22px}
#mg .card.note{position:sticky;top:66px;z-index:3;background:#fff3c4;border:2px solid #e2431f;font-weight:700}
/* ---- modern arayüz ---- */
:root{--sh:0 2px 10px rgba(30,25,60,.14);--rd:14px}
.mb{border:1.5px solid var(--fg);border-radius:var(--rd);box-shadow:var(--sh);min-width:min(280px,86vw);min-height:54px;padding:14px 22px;font-size:17px;transition:transform .12s}
.mb:active{transform:scale(.97)}.mb.sm{min-width:0;min-height:44px;border-radius:12px}
.card{border-radius:var(--rd);box-shadow:var(--sh);padding:14px 16px}
#menu{gap:14px}#menu h1{font-size:clamp(30px,9vw,44px)}
#mg{padding:10px 12px 90px;gap:12px}#mg .card{border-radius:var(--rd);line-height:1.8;box-shadow:0 2px 10px rgba(0,0,0,.35)}
#mg>*{flex-shrink:0}
#mg .tabs{gap:6px;padding:8px 0;flex:0 0 auto;min-height:62px;box-sizing:border-box;align-items:center;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#mg .tabs::-webkit-scrollbar{display:none}
#mg .tabs .mb{flex:1 0 auto;min-height:44px;border-radius:12px 12px 4px 4px;opacity:.72;box-shadow:none;border-width:1.5px}
#mg .tabs .mb.on{opacity:1;background:#c9a24b;border-bottom:4px solid #e2431f;font-weight:800;transform:translateY(-1px)}
#ov>div{max-width:min(440px,94vw);border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.45);padding:20px}
#ov button{border-radius:12px;min-height:46px;box-shadow:var(--sh)}
.yt{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0}.yt th{font-size:11px;opacity:.7;border-bottom:1.5px solid var(--road)}
.yt td,.yt th{padding:6px 4px;text-align:right}.yt td:first-child,.yt th:first-child{text-align:left}.yt tr.me{background:rgba(226,67,31,.15);font-weight:700}

 else if(tab==='veh'){h+=`<div class='card'>${B2('dsn','🛠 Yeni Araç Tasarla',0,1)}<br><small>Kendi aracını tasarla; hız, kapasite ve fiyat tasarımına göre belirlenir.</small></div>`+av().map(v=>`<div class='card'><span style='display:inline-block;width:12px;height:12px;border-radius:50%;background:${vacc(v)};border:1px solid #888'></span> ${VKIND[vreq(v)]} <b>${v.n}</b> ${v.custom?'🛠':v.ai?'🏭':''}<br>Hız ${v.v} · Kapasite ${fm(v.cap)} kişi · ${fm(v.cost)} ₺ · Gerekli ray: ${TRK[vreq(v)].n}</div>`).join('');const f=(S.veh||[]).filter(v=>v.from>S.year);if(f.length)h+=`<div class='card'>Yakında: ${f.map(v=>v.n+' ('+v.from+')').join(', ')}</div>`}
 else if(tab==='stops')h+=S.st.map((s,j)=>`<div class='card'><b>${s.name}</b> · ${s.ilce} · yoğunluk %${Math.round(s.pop*100)} · bekleyen ${fm(wt(s))} / ${fm(lim(s))}${wt(s)>lim(s)*.8?'<br>⚠ '+why(s):''}<br>Peron ${s.pl||0}/3 ${B2('pl'+j,(s.pl||0)<3?'⬆ '+fm(60000*K()*((s.pl||0)+1))+' ₺':'maks')} · Ticari alan ${s.sh||0}/3 ${B2('sh'+j,(s.sh||0)<3?'⬆ '+fm(80000*K()*((s.sh||0)+1))+' ₺':'maks')}<br><small>Peron: kalabalık sınırını artırır. Ticari alan: saniyede gelir getirir.</small></div>`).join('');
 else if(tab==='fin'){const inc=S.st.reduce((a,s)=>a+(s.sh||0)*s.pop*350*K(),0),p=upkParts(),lm=S.lastMaint;
  h+=`<div class='card'>Bütçe: <b>${fm(S.money)} ₺</b>${loanHtml()}<br>Tahmini yıllık bakım: <b>${fm(upk())} ₺</b> <small>(trenler ${fm(p.tr)} · ray ${fm(p.tk)} · peron/ticari ${fm(p.pl)})</small>${lm?`<br>Son ödenen: <b>${fm(lm.tr+lm.tk+lm.pl)} ₺</b> <small>(trenler ${fm(lm.tr)} · ray ${fm(lm.tk)} · peron/ticari ${fm(lm.pl)})</small>`:''}<br>Ticari gelir: <b>${fm(inc)} ₺/sn</b><br>Hat: ${S.ln.length} · Tren: ${S.ln.reduce((a,l)=>a+l.tr.length,0)}<br>Taşınan yolcu: <b>${fm(S.score)}</b><br><small>Gelir = taşınan yolcu × bilet fiyatı. Boş çalışan hatların bakımı %60’a kadar ucuzlar. Bütçe ${fm(bankrupt())} ₺ altına düşerse iflas edersin.</small></div>`}
 else{S.tenderSeen=1;h+=tndHtml()}
 {const sy=$('mg').scrollTop;$('mg').innerHTML=h;$('mg').scrollTop=sy}}
function mgClose(){$('mg').style.display='none';if(started&&!S.over)playing=true}
function openTab(t){if(!started||S.over)return;if($('mg').style.display!=='flex'){if(!playing)return;playing=false;$('mg').style.display='flex'}tab=t;note='';mgDraw()}
$('mg').onchange=e=>{const i=e.target.dataset.s;if(i!==undefined)S.ln[+i].vm=S.veh.find(v=>v.n===e.target.value)||S.ln[+i].vm};
$('mg').onclick=e=>{const el=e.target.closest&&e.target.closest('[data-g]'),a=el&&el.dataset.g;if(!a)return;
 if(a==='x')return mgClose();
 if(a==='dsn')return openDesign();
 if(['lines','veh','stops','fin','tnd'].includes(a)){tab=a;note='';$('mg').scrollTop=0;return mgDraw()}
 if(a==='loan'||a==='repay'){loanOp(a);return mgDraw()}
 const m=a.match(/^(up|bt|rn|fm|fp|rm|pl|sh|tb|bp|bm)(\d+)(?:_(\d+))?$/);if(!m)return;
 const k=m[1],i=+m[2],l=S.ln[i],pay=c=>{if(S.money<c){note='Yetersiz bütçe ('+fm(c)+' ₺)';return false}S.money-=c;return true};note='';
 if(k==='up'){const n=nextTrk(l);if(n&&pay(upc(l))){l.trk=(l.trk||0)+1;note='Ray yükseltildi: '+n.n}}
 else if(k==='bt'||k==='rn'){const v=l.vm||cheap();
  if(vreq(v)>(l.trk||0))note='Bu araç için ray en az “'+TRK[vreq(v)].n+'” olmalı';
  else if(k==='bt'){if(l.tr.length>=4)note='Bu hatta en fazla 4 tren olur';else if(pay(v.cost)){l.tr.push({i:0,p:0,d:1,pax:[],m:v});note=v.n+' filoya katıldı'}}
  else{const n=l.tr.filter(r=>r.m!==v).length;if(!n)note='Filo zaten bu araçta';else if(pay(Math.round(n*v.cost*.6))){l.tr.forEach(r=>r.m=v);note='Filo yenilendi: '+v.n}}}
 else if(k==='fm'||k==='fp'){const f0=l.f0||25,sp=Math.max(1,Math.round(f0*.1)),c=l.fare||f0;l.fare=k==='fm'?Math.max(Math.round(f0*.4),c-sp):Math.min(Math.round(f0*2.4),c+sp)}
 else if(k==='rm'){if(l.st.length<=2)note='Hatta en az 2 durak kalmalı';else{l.st.splice(+m[3],1);l.tr.forEach(r=>{r.i=0;r.p=0;r.d=1});note='Durak hattan çıkarıldı'}}
 else if(k==='bp'||k==='bm'){const p=S.tn[i],st=Math.max(1000,Math.round(p.floor*.1/1000)*1000);p.bid=Math.max(p.floor,p.bid+(k==='bp'?st:-st))}
 else if(k==='tb'){const p=S.tn[i];if(S.year<p.from)note='Bu proje henüz açılmadı';else if(p.status!=='open')note='Bu ihale için zaten teklif verildi';else if(S.money<p.bid)note='Teklif tutarı kasanın üzerinde';else{p.dep=Math.round(p.bid*.1);S.money-=p.dep;p.status='wait';note='Teklif verildi: '+fm(p.bid)+' ₺ (teminat '+fm(p.dep)+' ₺ alındı). Sonuç bir sonraki yıl başında; ana ekranda oyun hızını artırabilirsin.'}}
 else{const s=S.st[i];if((s[k]||0)>=3)note='Azami seviye';else if(pay((k==='pl'?60000:80000)*K()*((s[k]||0)+1))){s[k]=(s[k]||0)+1;note=s.name+(k==='pl'?' peronu':' ticari alanı')+' yükseltildi'}}
 mgDraw()};
const FM2=[['lines','🛤','Hatlar'],['veh','🚆','Araçlar'],['dsn','🛠','Araç Tasarla'],['stops','🚏','Duraklar'],['fin','💰','Mali'],['tnd','📜','İhaleler'],['home','🏠','Ana Menü']];
$('fm').innerHTML=`<div class='ft'>KOMUTA MERKEZİ</div>`+FM2.map(x=>`<button data-t='${x[0]}'><i>${x[1]}</i>${x[2]}</button>`).join('');
$('fb').innerHTML=`<span style='font-size:20px;line-height:1'>≡</span> Menü`;
$('fb').onclick=()=>$('fm').classList.toggle('open');
function fabShow(v){$('fab').style.display=v?'flex':'none'}
$('fm').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;const t=b.dataset.t;$('fm').classList.remove('open');
 if(t==='home'){$('mg').style.display='none';$('ds').style.display='none';fabShow(1);menu();return}
 if(t==='dsn')return openDesign();
 openTab(t)};
function spdUI(){$('spd').innerHTML=SPDS.map((x,i)=>`<button class='sb${i===SPI?' on':''}' data-i='${i}' title='${i?'Oyun hızı: '+x+'×':'Duraklat'}'>${i?x+'×':'⏸'}</button>`).join('')}
$('spd').onclick=e=>{const i=e.target.dataset.i;if(i===undefined)return;SPI=+i;if(SPI>0){CFG.spi=SPI;sv()}spdUI()};

/* ===== Araç tasarımı ===== */
const WD=[2.0,2.2,2.4,2.65,2.9,3.2],TECH=['Atlı (at gücü)','Buharlı','Elektrikli','Metro seti','Sürücüsüz'],DCOL=['#d8432a','#e6a817','#1f4fa3','#14958f','#8a3fa0','#444'],BASEV=[38,62,75,100,125],WREQ=[0,0,1,2,3,3];
let D={name:'Prototip',wg:2,wd:2,se:80,st:160,pw:3,tech:0,col:0,tab:'body',note:'',lastV:null};
function dsStats(){const A=D.wg*WD[D.wd]*18,used=D.se*.45+D.st*.22;return{A,used,ok:used<=A*.92,req:Math.max(D.tech,WREQ[D.wd]),cap:Math.max(20,D.se+D.st),v:Math.round(BASEV[D.tech]*(.8+.08*D.pw)*(1-.03*(D.wg-1))),cost:K()*1000*Math.round(D.wg*(25+D.tech*20)*(.8+D.wd*.1)+D.se*.8+D.st*.25+D.pw*12*D.wg)}}
function dsSvg(){const h=30+D.wd*7,wl=Math.min(86,380/D.wg-6),x0=(430-D.wg*(wl+4))/2+14;let s='';
 for(let i=0;i<D.wg;i++){const x=x0+i*(wl+4);s+=`<rect x='${x}' y='${130-h}' width='${wl}' height='${h}' rx='8' fill='${DCOL[D.col]}' stroke='#fff' stroke-width='2'/>`;
  const nw=Math.max(1,Math.min(7,Math.round(D.se/D.wg/5))),ww=(wl-16)/nw;for(let k=0;k<nw;k++)s+=`<rect x='${x+8+k*ww}' y='${138-h}' width='${ww-4}' height='${h*.35}' rx='3' fill='#bfe3ff'/>`;
  s+=`<circle cx='${x+14}' cy='134' r='5' fill='#222'/><circle cx='${x+wl-14}' cy='134' r='5' fill='#222'/>`;
  if(D.tech>=2)s+=`<path d='M${x+wl/2-8} ${130-h} l8 -12 l8 12' stroke='#fff' fill='none' stroke-width='2'/>`}
 if(D.tech===0)s+=`<text x='${x0-30}' y='128' font-size='26'>🐎</text>`;
 s+=`<rect x='10' y='139' width='410' height='3' fill='#fff'/>`;
 return `<svg viewBox='0 0 430 160' style='width:100%;max-width:460px'>${s}</svg>`}
function openDesign(){if(!started||S.over)return;if(!S.veh){msg('Araç tasarımı Hikaye Modu’nda kullanılır');return}$('mg').style.display='none';playing=true;dsOpen()}
function dsOpen(){if(!playing)return;playing=false;D.tech=Math.min(D.tech,maxT());D.note='';D.tab='body';D.lastV=null;$('ds').style.display='flex';fabShow(0);dsDraw()}
function dsDraw(){const s=dsStats(),yr=S.year||2000;
 const L=(lbl,k,txt)=>`<div class='dl'>${lbl}<div class='dr'><b data-d='${k}:-1'>−</b><span>${txt}</span><b data-d='${k}:1'>+</b></div></div>`;let left='';
 if(D.tab==='body')left=L('Vagon sayısı','wg',D.wg)+L('Genişlik','wd',WD[D.wd]+' m')+L('Koltuk sayısı','se',D.se)+L('Ayakta yolcu','st',D.st);
 else if(D.tab==='mot')left=L('Teknoloji','tech',TECH[D.tech])+L('Motor gücü','pw',D.pw)+`<small>${TRK[D.tech].from+' yılından beri mevcut'}</small>`;
 else if(D.tab==='col')left=`<div class='dl'>Boya</div><div class='dr' style='flex-wrap:wrap'>${DCOL.map((c,i)=>`<i data-d='col:${i}' style='display:inline-block;width:34px;height:34px;border-radius:50%;background:${c};border:3px solid ${D.col===i?'#fff':'transparent'};cursor:pointer'></i>`).join('')}</div>`;
 else left=`<div class='dl'>Gerekli ray: <b>${TRK[s.req].n}</b></div>`+TRK.map((t,i)=>`<div class='dl'>${i>=s.req?'✓':'✗'} ${t.n}${t.from>yr?' <small>(henüz yok)</small>':''}</div>`).join('')+S.ln.map((l,i)=>`<div class='dl'>Hat ${i+1}: ${(l.trk||0)>=s.req?'✓ uyumlu':'✗ '+(nextTrk(l)?`<span class='lk' data-d='ru:${i}'>⬆ ${nextTrk(l).n} (${fm(upc(l))}₺)</span>`:'yükseltilemiyor')}</div>`).join('');
 const T=(k,ic)=>`<span class='db${D.tab===k?' on':''}' data-d='tab:${k}'>${ic}</span>`;
 const asg=D.lastV?`<div class='dst'>Hemen bir hatta ata (+1 tren): ${S.ln.length?S.ln.map((l,i)=>`<span class='lk' data-d='as:${i}'>Hat ${i+1}</span>`).join(''):'<small>henüz hat yok</small>'}</div>`:'';
 $('ds').innerHTML=`<div class='dh'><span>${fm(S.money)} ₺ | <input data-n value='${D.name}' maxlength='18'></span></div>
<div class='dm'><div class='dleft'>${left}</div><div class='dc'>${dsSvg()}<div class='dst'>${D.se} koltuk + ${D.st} ayakta yolcu<br>Kapasite: <b>${s.cap}</b> · Hız: <b>${s.v}</b> · Fiyat: <b>${fm(s.cost)} ₺</b><br>Gerekli ray: <b>${TRK[s.req].n}</b><br>Zemin: ${s.used.toFixed(0)} / ${(s.A*.92).toFixed(0)} ${s.ok?'':`<b class='bad'>aşırı dolu!</b>`}</div>${D.note?`<div class='dst'>${D.note}</div>`:''}${asg}</div></div>
<div class='dbar'><span class='db' data-d='back:0'>‹</span>${T('body','📐')}${T('col','🎨')}${T('mot','⚙')}${T('ray','🛤')}<span class='db' data-d='save:0'>✓</span></div>`}
$('ds').oninput=e=>{if(e.target.dataset.n!==undefined)D.name=e.target.value.replace(/[^A-Za-z0-9ÇçĞğİıÖöŞşÜü -]/g,'')};
$('ds').onclick=e=>{const t=e.target.closest('[data-d]');if(!t)return;const[k,v]=t.dataset.d.split(':'),n=+v,yr=S.year||2000;D.note='';
 if(k==='back'){$('ds').style.display='none';fabShow(1);if(started&&!S.over)playing=true;return}
 if(k==='tab')D.tab=v;
 else if(k==='wg')D.wg=Math.min(6,Math.max(1,D.wg+n));
 else if(k==='wd')D.wd=Math.min(5,Math.max(0,D.wd+n));
 else if(k==='se')D.se=Math.min(400,Math.max(0,D.se+n*10));
 else if(k==='st')D.st=Math.min(1200,Math.max(0,D.st+n*20));
 else if(k==='pw')D.pw=Math.min(5,Math.max(1,D.pw+n));
 else if(k==='tech'){const t2=D.tech+n;if(t2>=0&&t2<5){if(TRK[t2].from<=yr)D.tech=t2;else D.note='Bu teknoloji henüz geliştirilmedi ('+TRK[t2].from+')'}}
 else if(k==='col')D.col=n;
 else if(k==='ru'){const l=S.ln[n],nx=nextTrk(l);if(nx){const c=upc(l);if(S.money<c)D.note='Yetersiz bütçe';else{S.money-=c;l.trk=(l.trk||0)+1;D.note='Ray yükseltildi: '+nx.n}}}
 else if(k==='as'){const l=S.ln[n],vv=D.lastV;if(l&&vv){
  if(vreq(vv)>(l.trk||0))D.note='Hat '+(n+1)+' rayı bu araç için yetersiz: 🛤 sekmesinden yükselt';
  else{l.vm=vv;if(l.tr.length<4&&S.money>=vv.cost){S.money-=vv.cost;l.tr.push({i:0,p:0,d:1,pax:[],m:vv});D.note='✓ Hat '+(n+1)+' artık '+vv.n+' kullanıyor, 1 tren eklendi (−'+fm(vv.cost)+' ₺)'}else D.note='✓ Hat '+(n+1)+' aracı '+vv.n+' oldu (tren eklenemedi: bütçe ya da 4 tren sınırı)'}}}
 else if(k==='save'){const s=dsStats();
  if(!s.ok)D.note='Zemin alanı aşıldı: koltuk veya ayakta sayısını azalt';
  else if(S.money<80000)D.note='Tasarım ücreti 80.000 ₺';
  else{S.money-=80000;const b=D.name||'Prototip';let nm=b,c=1;while(S.veh.some(x=>x.n===nm))nm=b+' '+(++c);
   const nv={n:nm,from:S.year,v:s.v,cap:s.cap,cost:s.cost,req:s.req,custom:1,col:DCOL[D.col]};S.veh.push(nv);D.lastV=nv;D.note='✓ '+nm+' kaydedildi (−80.000 ₺). Aşağıdan hemen bir hatta atayabilirsin.'}}
 dsDraw()};

/* ===== Başlangıç ===== */
rs();init();theme();spdUI();requestAnimationFrame(loop);menu();

document.addEventListener('contextmenu',e=>e.preventDefault());
{let lt=0,lx=0,ly=0;cv.addEventListener('pointerup',e=>{if(e.pointerType!=='touch'||pinch)return;const p=pt(e),n=performance.now();
 if(!hit(p.x,p.y)&&n-lt<320&&Math.hypot(p.x-lx,p.y-ly)<30){VZ=1;VX=0;VY=0;lt=0}else{lt=n;lx=p.x;ly=p.y}})}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&started&&!S.over&&playing){playing=false;menu()}});
addEventListener('orientationchange',()=>setTimeout(rs,250));
window.__back=()=>{if($('np').style.display==='flex'||$('np').style.display==='block')return false;
 if($('ov').style.display==='flex'){$('ov').style.display='none';return true}
 if($('ds').style.display==='flex'){$('ds').style.display='none';playing=true;fabShow(1);return true}
 if($('mg').style.display==='flex'){mgClose();return true}
 if($('menu').style.display==='flex'){if(started&&!S.over){$('menu').style.display='none';playing=true;return true}return false}
 if(started&&!S.over){playing=false;menu();return true}return false};
